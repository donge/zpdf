name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Zig 0.17.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run tests
        run: zig build test

      - name: Run ReleaseSafe tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Run gates
        run: zig build gate

      - name: Check formatting
        run: zig fmt --check build.zig gen_test.zig src/*.zig

      - name: Build native and WASM targets
        run: |
          zig build
          zig build wasm

  capi:
    name: C API (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build static library
        run: zig build capi -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} --prefix dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libzpdf-${{ matrix.target }}
          path: dist/lib/libzpdf_c.a
